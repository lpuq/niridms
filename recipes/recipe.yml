# Niri + DankMaterialShell on a Bluefin DX base.
# recipes/recipe.yml in your fork of blue-build/template
# Module reference: https://blue-build.org/reference/modules/

name: niridms
description: Bluefin DX base with niri + DankMaterialShell
base-image: ghcr.io/ublue-os/bluefin-dx   # DX = container/dev tooling included
image-version: stable

modules:

  - type: dnf
    repos:
      copr:
        - avengemedia/dms
        - avengemedia/danklinux
    install:
      packages:
        # --- session ---
        - niri
        - dms                        # pulls quickshell, matugen, cava, cliphist,
                                     # wl-clipboard, dgop, qt6ct, Inter +
                                     # Fira Code + Material Symbols
        - xwayland-satellite         # X11 apps under niri

        # --- terminal ---
        - ghostty

        # --- fonts DMS deps don't cover ---
        - google-noto-serif-fonts

        # --- GUI utilities that don't depend on GNOME Shell ---
        - system-config-printer
        - qt5ct                      # theming for older Qt5 apps

        # --- session utilities ---
        - brightnessctl
        - playerctl

        # --- virtualization (KVM/libvirt) ---

  # quickshell links private Qt ABI; use the DankLinux rebuild, not Fedora's.
  - type: dnf
    replace:
      - from-repo: copr:copr.fedorainfracloud.org:avengemedia:danklinux
        allow-erasing: true
        packages:
          - old: quickshell
            new: quickshell-git

  # Ships files/system/** into the image. Needed for the v4l2loopback config.
  - type: files
    files:
      - source: system
        destination: /

  - type: systemd
    system:
      enabled:
        - libvirtd.socket

  # Apps live in Flatpak, not the image.
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - org.mozilla.firefox
          - com.obsproject.Studio
          - org.keepassxc.KeePassXC
          - org.localsend.localsend_app
          - com.moonlight_stream.Moonlight
          - dev.zed.Zed
          - org.gnome.SimpleScan
          - org.fedoraproject.MediaWriter
          - com.github.tchx84.Flatseal
          - com.saivert.pwvucontrol

  - type: signing
